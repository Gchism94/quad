# PostgreSQL only, for local Cairn development — the server runs on your machine,
# not in a container.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# Then point the server at it (note the 5433 host port, chosen so this does not
# collide with a Postgres you may already run locally):
#
#   export CAIRN_DATABASE_URL=postgres://cairn:cairn@localhost:5433/cairn?sslmode=disable
#   CAIRN_DB_AUTOMIGRATE=1 go run ./cmd/cairn
#
# To deploy Cairn itself, use docker-compose.yml and docs/deploy.md.
name: cairn-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      POSTGRES_DB: cairn
    ports:
      - "5433:5432"
    volumes:
      - cairn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  cairn_pgdata:
